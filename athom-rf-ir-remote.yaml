# Script for sending raw IR signals
script:
  - id: send_raw_signal
    then:
      - lambda: |-
          std::vector<int> signal_data = id(signal_nvs).load_from_nvs<int>(id(signal_select_index));
          if (signal_data.size() > 0) {
            ESP_LOGI("IR_SEND", "Sending signal from slot %d, size: %d", id(signal_select_index), signal_data.size());
            id(status_text).publish_state("Sending signal...");
            auto transmit = id(ir_transmitter).transmit();
            auto data = transmit.get_data();
            data->set_carrier_frequency(38000);
            for (int i = 0; i < signal_data.size(); i++) {
              if (i % 2 == 0) {
                data->mark(signal_data[i]);
              } else {
                data->space(signal_data[i]);
              }
            }
            transmit.perform();
            id(status_text).publish_state("Signal sent!");
          } else {
            ESP_LOGW("IR_SEND", "No signal stored in slot %d", id(signal_select_index));
            id(status_text).publish_state("No signal in this slot");
          }

  # Transmits the A-OK frame currently in rf_tx_code, following
  # github.com/akirjavainen/A-OK exactly: AGC 5300us HIGH + 530us LOW, then 65
  # bits (bit 0 = 270us HIGH + 565us LOW, bit 1 = 565us HIGH + 270us LOW; the
  # 65th bit is a constant 1), then 5030us of radio silence, the whole command
  # repeated 8 times. The stored code holds the first 64 bits; the constant
  # trailing 1 is appended here, and its LOW half merges into the silence.
  - id: aok_send
    then:
      - lambda: |-
          // Preset 0 = upstream spec (akirjavainen/A-OK), 1 = measured on
          // this hardware against a real remote (rf433-direct-transmit).
          int agc_high, agc_low, short_us, long_us;
          if (id(rf_aok_preset) == 1) {
            agc_high = 5114; agc_low = 604; short_us = 302; long_us = 604;
          } else {
            agc_high = 5300; agc_low = 530; short_us = 270; long_us = 565;
          }
          uint64_t code = id(rf_tx_code);
          int reps = id(rf_aok_repeats);
          if (reps < 1) reps = 1;
          std::vector<int32_t> w;
          w.reserve(16 + reps * (2 + 2 * 65));
          if (id(rf_aok_preamble)) {
            // akirjavainen/A-OK: some real remotes send 8x(340us mark +
            // 520us space) before the AGC header, to settle a receiver's
            // AGC/slicer ahead of the frame. Sent ONCE before the whole
            // burst, matching how real remotes place it - not once per
            // repeat, which is why all repeats are built into one buffer
            // here instead of using transmit_raw's own repeat block.
            for (int i = 0; i < 8; i++) { w.push_back(340); w.push_back(-520); }
          }
          for (int r = 0; r < reps; r++) {
            w.push_back(agc_high);
            w.push_back(-agc_low);
            for (int i = 63; i >= 0; i--) {
              if ((code >> i) & 1) { w.push_back(long_us); w.push_back(-short_us); }
              else                 { w.push_back(short_us); w.push_back(-long_us); }
            }
            // Constant 65th bit is always 1 (long mark); its own short-space
            // half plus the configured silence make up the gap to the next
            // repeat.
            w.push_back(long_us);
            w.push_back(-(short_us + id(rf_aok_silence_us)));
          }
          id(rf_aok_buf) = w;
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: !lambda 'return id(rf_aok_buf);'

  # Publishes a diagnostic event where it survives: the RF Event entity (Home
  # Assistant records its state history) and the HA logbook. The logbook push
  # needs "allow the device to perform Home Assistant actions" enabled in the
  # ESPHome integration settings; without it, the entity still updates.
  - id: ha_event
    mode: queued
    parameters:
      msg: string
    then:
      - text_sensor.template.publish:
          id: rf_event_text
          state: !lambda 'return msg;'
      - homeassistant.action:
          action: logbook.log
          data:
            name: "RF433"
            message: !lambda 'return msg;'

  # Repopulates the 12 cover slots with known-good codes if a slot is EMPTY -
  # notably after the "Factory Reset" button, which calls ESP-IDF's
  # nvs_flash_erase() and wipes the entire NVS partition (every namespace,
  # not just ESPHome's own preferences), taking every learned RF/IR code with
  # it. Runs once at boot, before rebuild_cover_cache, so a seeded slot is
  # live immediately with no second reboot needed.
  #
  # Never overwrites a slot that already holds data: re-learning from the
  # physical remote (which is definitionally the ground truth for what that
  # remote actually transmits) always takes precedence over this fallback.
  # These 12 values were captured and checksum-verified against the real
  # remotes this session - see PROTOCOLS.md / the conversation history for
  # how; they are specific to this household's four covers, not a generic
  # default appropriate for a different installation.
  - id: seed_known_codes
    mode: queued
    then:
      - lambda: |-
          struct Seed { int slot; int type; uint32_t hi; uint32_t lo; const char *label; };
          static const Seed SEEDS[12] = {
              // Persiana Sala (Dooya, id=0xC089B7 channel=5)
              {10, -1, 0x000000C0u, 0x89B70511u, "Sala open"},
              {11, -1, 0x000000C0u, 0x89B70555u, "Sala stop"},
              {12, -1, 0x000000C0u, 0x89B70533u, "Sala close"},
              // Persiana Dormitorio (Dooya, id=0xC389EB channel=5)
              {13, -1, 0x000000C3u, 0x89EB0511u, "Dormitorio open"},
              {14, -1, 0x000000C3u, 0x89EB0555u, "Dormitorio stop"},
              {15, -1, 0x000000C3u, 0x89EB0533u, "Dormitorio close"},
              // Persiana Elia (A-OK, id=0xC86E2C address=0x0200)
              {16, -2, 0xA3C86E2Cu, 0x02000B6Fu, "Elia open"},
              {17, -2, 0xA3C86E2Cu, 0x02002387u, "Elia stop"},
              {18, -2, 0xA3C86E2Cu, 0x020043A7u, "Elia close"},
              // Persiana Sofia (A-OK, id=0xC86E2C address=0x0100)
              {19, -2, 0xA3C86E2Cu, 0x01000B6Eu, "Sofia open"},
              {20, -2, 0xA3C86E2Cu, 0x01002386u, "Sofia stop"},
              {21, -2, 0xA3C86E2Cu, 0x010043A6u, "Sofia close"},
          };
          int seeded = 0;
          for (int i = 0; i < 12; i++) {
            std::vector<int> existing = id(signal_nvs).load_from_nvs<int>(SEEDS[i].slot);
            if (existing.size() >= 3) continue;  // already learned - leave it alone
            std::vector<int> d;
            d.push_back(SEEDS[i].type);
            d.push_back((int) SEEDS[i].hi);
            d.push_back((int) SEEDS[i].lo);
            id(signal_nvs).save_to_nvs(SEEDS[i].slot, d);
            ESP_LOGW("RF_SEED", "Slot %d (%s) was empty - seeded with known code", SEEDS[i].slot, SEEDS[i].label);
            seeded++;
          }
          if (seeded > 0) {
            char eb[64];
            snprintf(eb, sizeof(eb), "Seeded %d empty cover slot(s) with known codes", seeded);
            id(ha_event).execute(std::string(eb));
          }

  # Rebuilds the RAM cache of cover-assigned codes from the hardcoded slot map
  # below. Runs at boot and after anything that can change a slot's contents
  # (learning, clearing). There is no runtime assignment step any more - which
  # slot backs which cover action is fixed at build time; only what's LEARNED
  # into that slot can change, which is what this rebuild actually tracks.
  - id: rebuild_cover_cache
    mode: queued
    then:
      - lambda: |-
          // Cover N -> NVS slot, one flat array per action so each reads in
          // plain ascending order exactly as assigned - slots run 10-21,
          // three consecutive per cover, in [open, stop, close] order on the
          // "RF Signal Slot" selector (cover 1 = Signal 0/1/2 = 10/11/12):
          //   Cover 1: open=10 stop=11 close=12
          //   Cover 2: open=13 stop=14 close=15
          //   Cover 3: open=16 stop=17 close=18
          //   Cover 4: open=19 stop=20 close=21
          static const int COVER_OPEN[4]  = {10, 13, 16, 19};
          static const int COVER_STOP[4]  = {11, 14, 17, 20};
          static const int COVER_CLOSE[4] = {12, 15, 18, 21};
          // Indexed by action (0=open,1=close,2=stop - the same convention
          // the cover: platform's action calls and ANAMES/CMDS below use),
          // so a loop over actions can pick the right array above.
          static const int *ACTION_SLOTS[3] = {COVER_OPEN, COVER_CLOSE, COVER_STOP};
          static const char *ANAMES[3] = {"OPEN", "CLOSE", "STOP"};
          static const char TAGC[3] = {'o', 'c', 's'};
          int assigned = 0;
          std::string sum;
          char sb[24];
          text_sensor::TextSensor *code_sensors[4] = {
              id(cover_1_codes), id(cover_2_codes), id(cover_3_codes), id(cover_4_codes)};
          for (int c = 0; c < 4; c++) {
            snprintf(sb, sizeof(sb), "%sC%d", c ? " | " : "", c + 1);
            sum += sb;
            std::string codes;
            for (int a = 0; a < 3; a++) {
              int idx = c * 3 + a;
              int slot = ACTION_SLOTS[a][c];
              std::vector<int> d = id(signal_nvs).load_from_nvs<int>(slot);
              char cb[28];
              if (d.size() >= 3) {
                id(cover_code_type)[idx] = d[0];
                id(cover_code_val)[idx] = ((uint64_t) (uint32_t) d[1] << 32) | (uint32_t) d[2];
                assigned++;
                snprintf(sb, sizeof(sb), " %c:%d", TAGC[a], slot);
                snprintf(cb, sizeof(cb), "%c:0x%016llX ", TAGC[a],
                         (unsigned long long) id(cover_code_val)[idx]);
                ESP_LOGI("RF_COVER", "  cover %d %-5s = slot %d  type=%d code=0x%016llX",
                         c + 1, ANAMES[a], slot, d[0], (unsigned long long) id(cover_code_val)[idx]);
              } else {
                id(cover_code_type)[idx] = 0;
                id(cover_code_val)[idx] = 0;
                snprintf(sb, sizeof(sb), " %c:%d!", TAGC[a], slot);
                snprintf(cb, sizeof(cb), "%c:- ", TAGC[a]);
                ESP_LOGW("RF_COVER", "  cover %d %-5s = slot %d  NOT YET LEARNED", c + 1, ANAMES[a], slot);
              }
              sum += sb;
              codes += cb;
            }
            code_sensors[c]->publish_state(codes);
          }
          id(cover_assign_text).publish_state(sum);
          ESP_LOGI("RF_COVER", "Cover code cache rebuilt: %d of 12 slots learned", assigned);
          char eb[64];
          snprintf(eb, sizeof(eb), "Cover cache: %d of 12 slots learned", assigned);
          id(ha_event).execute(std::string(eb));

  # A frame from a physical remote arrived (rx_type/rx_code). If it matches a
  # code assigned to a cover, drive that cover's time-based state machine so
  # the position estimate follows the remote - WITHOUT retransmitting, since
  # the motor already heard the remote directly. The echo window makes
  # cover_cmd skip the transmit for calls triggered from here.
  - id: rf_rx_dispatch
    mode: queued
    then:
      - lambda: |-
          // Dooya's low 4 bits are a "check" value that climbs while a button
          // is held (ESPHome's own docs: "includes an indication that a
          // button is being held down") - it is not part of the command's
          // identity, so it is masked out of the comparison. A slot learned
          // at one check value would otherwise only ever re-match by luck,
          // when a later hold's counter happens to sweep back through it.
          // A-OK and rc_switch codes are fixed per command and compared whole.
          uint64_t dmask = (id(rx_type) == -1) ? ~0xFULL : ~0ULL;
          int match = -1;
          for (int i = 0; i < 12; i++) {
            if (id(cover_code_type)[i] != 0 &&
                id(cover_code_type)[i] == id(rx_type) &&
                ((id(cover_code_val)[i] ^ id(rx_code)) & dmask) == 0) { match = i; break; }
          }
          if (match < 0) {
            // A checksum-valid A-OK or fully-decoded Dooya frame is a real
            // remote press, worth surfacing even unmatched; rc_switch decodes
            // include ambient noise, so those stay at debug level.
            if (id(rx_type) < 0) {
              ESP_LOGI("RF_COVER", "Remote frame type=%d code=0x%016llX matches no cover assignment",
                       id(rx_type), (unsigned long long) id(rx_code));
              // One press = a burst of frames whose Dooya check nibble climbs
              // frame to frame; dedupe on the masked key so one press reports
              // once instead of flooding the logbook with every check value.
              static uint64_t last_um_key = 0;
              static uint32_t last_um_ms = 0;
              uint32_t umnow = millis();
              uint64_t um_key = id(rx_code) & dmask;
              if (um_key != last_um_key || umnow - last_um_ms > 1500) {
                char b[80];
                snprintf(b, sizeof(b), "Unmatched remote frame type=%d code=0x%016llX",
                         id(rx_type), (unsigned long long) id(rx_code));
                id(ha_event).execute(std::string(b));
              }
              last_um_key = um_key;
              last_um_ms = umnow;
            } else {
              ESP_LOGD("RF_COVER", "rc_switch frame proto=%d code=0x%016llX matches no cover assignment",
                       id(rx_type), (unsigned long long) id(rx_code));
            }
            return;
          }
          // One press decodes as a burst of frames for the same action (their
          // Dooya check nibble may climb frame to frame, already masked out
          // above): refresh the debounce on every frame, act only on the first.
          uint32_t now = millis();
          bool repeat = (match == id(rx_last_key)) && (now - id(rx_last_ms) < 1500);
          id(rx_last_key) = match;
          id(rx_last_ms) = now;
          if (repeat)
            return;
          int c = match / 3, a = match % 3;
          static const char *CMDS[3] = {"OPEN", "CLOSE", "STOP"};
          ESP_LOGI("RF_COVER", "Physical remote: cover %d %s - updating position, not retransmitting",
                   c + 1, CMDS[a]);
          {
            char b[48];
            snprintf(b, sizeof(b), "Remote press: cover %d %s", c + 1, CMDS[a]);
            id(ha_event).execute(std::string(b));
          }
          id(rf_echo_until) = now + 800;
          cover::Cover *covers[4] = {id(persiana_sala), id(persiana_dormitorio), id(persiana_elia), id(persiana_sofia)};
          auto call = covers[c]->make_call();
          if (a == 0) call.set_command_open();
          else if (a == 1) call.set_command_close();
          else call.set_command_stop();
          call.perform();

  # Drives Persiana Sala through an open/close/position move: transmits the RF
  # command immediately and unconditionally every time via cover_cmd - no
  # internal guard, unlike ESPHome's stock time_based platform - then
  # estimates position by elapsed time. mode: restart means a repeated press,
  # even mid-move, cancels the previous timer outright (its delayed finalize
  # step never runs) and starts a fresh one: the RF command still goes out
  # again immediately, and the interrupted move's last estimated position
  # becomes the new move's starting point.
  - id: cover_move_1
    mode: restart
    parameters:
      target: float
    then:
      - lambda: |-
          float cur = id(cov_pos_0);
          bool opening = target >= cur;
          float span = fabsf(target - cur);
          // A same-position "resend" (e.g. pressing Open while already at
          // 1.0) has span=0; floor it so the command still gets airtime
          // instead of computing a zero-length, no-op move.
          if (span < 0.05f) span = 0.05f;
          float full_s = opening ? id(rf_cover_1_open_s).state : id(rf_cover_1_close_s).state;
          id(cov_op)[0] = opening ? 1 : 2;
          id(cov_move_from)[0] = cur;
          id(cov_move_target)[0] = target;
          id(cov_move_start_ms)[0] = millis();
          id(cov_move_ms)[0] = (uint32_t) (span * full_s * 1000.0f);
      - cover.template.publish:
          id: persiana_sala
          current_operation: !lambda |-
            return id(cov_op)[0] == 1 ? esphome::cover::COVER_OPERATION_OPENING
                                          : esphome::cover::COVER_OPERATION_CLOSING;
      - script.execute:
          id: cover_cmd
          cover: 0
          cmd: !lambda 'return id(cov_op)[0] == 1 ? 0 : 1;'
      - script.wait: cover_cmd
      - delay: !lambda 'return id(cov_move_ms)[0];'
      - lambda: |-
          id(cov_pos_0) = id(cov_move_target)[0];
          id(cov_op)[0] = 0;
      - cover.template.publish:
          id: persiana_sala
          position: !lambda 'return id(cov_pos_0);'
          current_operation: "IDLE"
      - if:
          condition:
            lambda: 'return id(cov_move_target)[0] > 0.001f && id(cov_move_target)[0] < 0.999f;'
          then:
            - script.execute: { id: cover_cmd, cover: 0, cmd: 2 }

  # Drives Persiana Dormitorio through an open/close/position move: transmits the RF
  # command immediately and unconditionally every time via cover_cmd - no
  # internal guard, unlike ESPHome's stock time_based platform - then
  # estimates position by elapsed time. mode: restart means a repeated press,
  # even mid-move, cancels the previous timer outright (its delayed finalize
  # step never runs) and starts a fresh one: the RF command still goes out
  # again immediately, and the interrupted move's last estimated position
  # becomes the new move's starting point.
  - id: cover_move_2
    mode: restart
    parameters:
      target: float
    then:
      - lambda: |-
          float cur = id(cov_pos_1);
          bool opening = target >= cur;
          float span = fabsf(target - cur);
          // A same-position "resend" (e.g. pressing Open while already at
          // 1.0) has span=0; floor it so the command still gets airtime
          // instead of computing a zero-length, no-op move.
          if (span < 0.05f) span = 0.05f;
          float full_s = opening ? id(rf_cover_2_open_s).state : id(rf_cover_2_close_s).state;
          id(cov_op)[1] = opening ? 1 : 2;
          id(cov_move_from)[1] = cur;
          id(cov_move_target)[1] = target;
          id(cov_move_start_ms)[1] = millis();
          id(cov_move_ms)[1] = (uint32_t) (span * full_s * 1000.0f);
      - cover.template.publish:
          id: persiana_dormitorio
          current_operation: !lambda |-
            return id(cov_op)[1] == 1 ? esphome::cover::COVER_OPERATION_OPENING
                                          : esphome::cover::COVER_OPERATION_CLOSING;
      - script.execute:
          id: cover_cmd
          cover: 1
          cmd: !lambda 'return id(cov_op)[1] == 1 ? 0 : 1;'
      - script.wait: cover_cmd
      - delay: !lambda 'return id(cov_move_ms)[1];'
      - lambda: |-
          id(cov_pos_1) = id(cov_move_target)[1];
          id(cov_op)[1] = 0;
      - cover.template.publish:
          id: persiana_dormitorio
          position: !lambda 'return id(cov_pos_1);'
          current_operation: "IDLE"
      - if:
          condition:
            lambda: 'return id(cov_move_target)[1] > 0.001f && id(cov_move_target)[1] < 0.999f;'
          then:
            - script.execute: { id: cover_cmd, cover: 1, cmd: 2 }

  # Drives Persiana Elia through an open/close/position move: transmits the RF
