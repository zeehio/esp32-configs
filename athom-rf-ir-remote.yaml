# Script for sending raw IR signals
script:
  # Builds an A-OK frame from its fields and transmits it. Everything about the
  # waveform is derived from the parameters, so nothing is replayed from a
  # capture - this is what makes the experiments reproducible and explainable.
  - id: aok_tx
    mode: single
    parameters:
      exp: string
      note: string
      id_sel: int        # 0 = 0xA3C86E2C (current 2-ch remote), 1 = 0xA3C056FF (old 8-ch)
      channel: int
      cmd: int
      t_us: int
      hdr_us: int
      hdr_space_us: int  # 0 => use 2*T (the normal header low)
      gap_us: int
      times: int
      trailer: int       # 1 => append the final 2T mark
      cks_delta: int     # 0 => correct checksum; non-zero corrupts it on purpose
    then:
      - lambda: |-
          static const uint32_t IDS[2] = {0xA3C86E2CUL, 0xA3C056FFUL};
          uint32_t dev = IDS[id_sel & 1];

          uint8_t b[8];
          b[0] = (uint8_t) (dev >> 24); b[1] = (uint8_t) (dev >> 16);
          b[2] = (uint8_t) (dev >> 8);  b[3] = (uint8_t) dev;
          b[4] = (uint8_t) channel; b[5] = 0x00; b[6] = (uint8_t) cmd;
          int s = 0;
          for (int i = 0; i < 7; i++) s += b[i];
          b[7] = (uint8_t) ((s + 0x5D + cks_delta) & 0xFF);

          uint64_t code = 0;
          for (int i = 0; i < 8; i++) code = (code << 8) | b[i];

          int hdr_low = (hdr_space_us > 0) ? hdr_space_us : 2 * t_us;
          std::vector<int32_t> w;
          w.reserve(2 + 128 + 1);
          w.push_back(hdr_us);
          w.push_back(-hdr_low);
          for (int i = 0; i < 8; i++) {
            for (int bit = 7; bit >= 0; bit--) {
              if ((b[i] >> bit) & 1) { w.push_back(2 * t_us); w.push_back(-t_us); }
              else                   { w.push_back(t_us);     w.push_back(-2 * t_us); }
            }
          }
          if (trailer) w.push_back(2 * t_us);

          id(exp_buf) = w;
          id(exp_times) = (uint32_t) times;
          id(exp_gap) = (uint32_t) gap_us;
          id(exp_trial)++;

          ESP_LOGI("EXP", "%s trial=%d | %s", exp.c_str(), id(exp_trial), note.c_str());
          ESP_LOGI("EXP", "  ID=0x%08X ch=%d pad=0x00 cmd=0x%02X cksum=0x%02X%s  code=0x%016llX",
                   (unsigned) dev, channel, (unsigned) b[6], (unsigned) b[7],
                   cks_delta ? " (DELIBERATELY WRONG)" : "", (unsigned long long) code);
          ESP_LOGI("EXP", "  T=%dus hdr=%dus/%dus gap=%dus repeats=%d trailer=%s items=%d",
                   t_us, hdr_us, hdr_low, gap_us, times, trailer ? "yes" : "no", (int) w.size());
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: !lambda 'return id(exp_buf);'
          repeat:
            times: !lambda 'return id(exp_times);'
            wait_time: !lambda 'return id(exp_gap);'
  - id: send_raw_signal
    then:
      - lambda: |-
          std::vector<int> signal_data = id(signal_nvs).load_from_nvs<int>(id(signal_select_index));
          if (signal_data.size() > 0) {
            ESP_LOGI("IR_SEND", "Sending signal from slot %d, size: %d", id(signal_select_index), signal_data.size());
            id(status_text).publish_state("Sending signal...");
            auto transmit = id(ir_transmitter).transmit();
            auto data = transmit.get_data();
            data->set_carrier_frequency(38000);
            for (int i = 0; i < signal_data.size(); i++) {
              if (i % 2 == 0) {
                data->mark(signal_data[i]);
              } else {
                data->space(signal_data[i]);
              }
            }
            transmit.perform();
            id(status_text).publish_state("Signal sent!");
          } else {
            ESP_LOGW("IR_SEND", "No signal stored in slot %d", id(signal_select_index));
            id(status_text).publish_state("No signal in this slot");
          }

  # Script for sending learned RF433 rc_switch signals
  - id: send_raw_rf_signal
    then:
      # Load [protocol, code_high, code_low] from NVS and rebuild the 64-bit code
      # into the temp globals that transmit_rc_switch_raw reads via !lambda.
      - lambda: |-
          std::vector<int> d = id(signal_nvs).load_from_nvs<int>(id(rf_signal_select_index));
          if (d.size() >= 3) {
            id(rf_tx_protocol) = d[0];
            id(rf_tx_code) = ((uint64_t) (uint32_t) d[1] << 32) | (uint32_t) d[2];
            ESP_LOGI("RF_SEND", "Sending protocol=%d code=%llu slot=%d",
                     id(rf_tx_protocol), (unsigned long long) id(rf_tx_code), id(rf_signal_select_index));
            id(rf_status_text).publish_state("Sending signal...");
          } else {
            id(rf_tx_protocol) = 0;
            ESP_LOGW("RF_SEND", "No signal stored in slot %d", id(rf_signal_select_index));
            id(rf_status_text).publish_state("No signal in this slot");
          }
      - if:
          condition:
            lambda: 'return id(rf_tx_protocol) > 0;'
          then:
            - remote_transmitter.transmit_rc_switch_raw:
                # protocol must be an RCSwitchBase: index the built-in table (1..8)
                protocol: !lambda 'return esphome::remote_base::RC_SWITCH_PROTOCOLS[id(rf_tx_protocol)];'
                # code must be an MSB-first binary string; its length is the bit count.
                # on_rc_switch does not expose the received bit length, and virtually
                # all 433MHz fixed-code remotes (EV1527/PT2262/…) are 24-bit.
                code: !lambda |-
                  uint64_t code = id(rf_tx_code);
                  const int nbits = 24;
                  std::string s;
                  for (int i = nbits - 1; i >= 0; i--)
                    s += (code & ((uint64_t) 1 << i)) ? '1' : '0';
                  return s;
                transmitter_id: rf_transmitter
                repeat:
                  times: 5
                  wait_time: 0us
            - lambda: 'id(rf_status_text).publish_state("Signal sent!");'

time:
  - platform: sntp
    id: sntp_time
  # Define the timezone of the device
    timezone: "${timezone}"
  # Change sync interval from default 5min to 6 hours (or as set in substitutions)
    update_interval: ${sntp_update_interval}
  # Set specific sntp servers to use
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
  # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
