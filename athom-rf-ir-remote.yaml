  #################### Direct RF433 cover codes ####################
  # Waveforms recovered from a Tuya RF bridge export, whose study-mode payload
  # is plain uint16 little-endian microsecond values.
  #
  # Sublimex DC1600 covers speak Dooya (40 bits: 24-bit id, 8-bit channel,
  # 4-bit button, 4-bit check) and are replayed verbatim -- confirmed working.
  # That decode is also what established the capture convention used here: the
  # first value is the inter-frame gap (~7.76 ms, matching Dooya) and odd
  # indices are marks, so each frame starts and ends on a mark. Field testing
  # confirmed the same convention holds for the A-OK captures.
  #
  # A-OK AC123-02D covers use a ~98-bit Manchester encoding whose fields are
  # still undecoded -- but replaying the timing needs no field decode.
  # Their symbols are NOT replayed verbatim: the Tuya receiver reported every
  # 1xT symbol as one of two values (e.g. 273 and 318 us) and occasionally
  # stretched a 2xT symbol as far as 696 us. Least-squares fitting shows each
  # frame is exactly 64 symbols of 1xT and 66 of 2xT with T ~= 300 us, and the
  # recovered Manchester half-bit stream is bit-identical before and after
  # snapping every symbol to n*T -- so that spread carries no information and
  # is measurement artifact from the Tuya receiver's slicer. Replaying it would
  # re-inject another receiver's distortion (up to 103 us of error per symbol)
  # into a phase-sensitive 98-bit frame. The values below are therefore snapped
  # to a clean per-frame n*T grid.

