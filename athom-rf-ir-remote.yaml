substitutions:
  # Default name
  name: "athom-rf-ir-remote"
  # Default friendly name
  friendly_name: "Athom RF IR Remote"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom esp32 RF433 IR Remote"
  # Project Name
  project_name: "China Athom Technology.Athom RF IR Remote"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v3.1.0"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "DEBUG"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # valid value: ballu, coolix, daikin, daikin_arc, daikin_brc, delonghi, emmeti, fujitsu_general, gree, hitachi_ac344, hitachi_ac424, climate_ir_lg, midea_ir, mitsubishi, noblex, tcl112, toshiba, whirlpool, yashima, whynter, zhlt01, heatpumpir
  # https://esphome.io/components/climate/climate_ir/
  AC_Platform_name: "coolix"

#########################GPIO######################
  RF_RX_PIN: GPIO19
  RF_TX_PIN: GPIO18
  IR_RX_PIN: GPIO33
  IR_TX_PIN: GPIO25
  Button_PIN: GPIO0
  LED_PIN: GPIO27
#########################GPIO######################

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2026.5.1
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 1min

# Global variables for IR learning
globals:
  - id: is_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: signal_select_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: filter_size
    type: int
    restore_value: no
    initial_value: '10'
  # RF433 learning mode flag (independent from IR learning)
  - id: is_rf_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  # RF433 slot index, offset to 10-25 so it never collides with IR slots 0-9
  - id: rf_signal_select_index
    type: int
    restore_value: yes
    initial_value: '10'
  # Temp holders for the rc_switch code/protocol to transmit; referenced by
  # transmit_rc_switch_raw's !lambda during playback
  - id: rf_tx_code
    type: uint64_t
    restore_value: no
    initial_value: '0'
  - id: rf_tx_protocol
    type: int
    restore_value: no
    initial_value: '0'
  # Gates the protocol-aware capture analyser on the RF receiver (see below).
  # Off by default so ambient 433 MHz traffic does not fill the log.
  - id: rf_analyze_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  # --- experiment plumbing (see the EXP buttons) ---
  - id: exp_buf
    type: std::vector<int32_t>
    restore_value: no
    initial_value: 'std::vector<int32_t>()'
  - id: exp_times
    type: uint32_t
    restore_value: no
    initial_value: '1'
  - id: exp_gap
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: exp_trial
    type: int
    restore_value: no
    initial_value: '0'
  # When non-zero, the analyser compares any decoded A-OK frame against this
  # and reports the loopback PASS/FAIL (see EXP E15).
  - id: exp_expect_code
    type: uint64_t
    restore_value: no
    initial_value: '0'

# Flash storage component for saving IR signals
Flash_comp:
  id: signal_nvs

api:
  reboot_timeout: 0s
  # Only enable BLE tracking when wifi is up and api is connected
  # Gives single-core ESP32-C3 devices time to manage wifi and authenticate with api
  on_client_connected:
     - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
  # Enables OTA firmware flashing from a URL (used by the update component below)
  - platform: http_request
    id: ota_http_request

# Required by the ota http_request platform and the update component.
# verify_ssl: false skips TLS cert validation to reduce heap/RAM pressure during
# the download; the manifest's MD5 still verifies firmware integrity before flashing.
http_request:
  id: http_request_component
  verify_ssl: false

update:
  # Managed updates via HTTP request: periodically checks the published manifest
  # and exposes a "Firmware Update" entity, pointing at this device's GitHub Pages
  # manifest. Pages URLs avoid the redirect/buffer issues of Release download URLs.
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    source: https://athom-tech.github.io/esp32-configs/firmware/athom-rf-ir-remote.manifest.json
    # update_interval defaults to 6h (how often it checks, not installs)

logger:
  baud_rate: 0
  level: ${log_level}

mdns:
  disabled: false

web_server:
  port: 80
  version: 3

network:
  enable_ipv6: ${ipv6_enable}

wifi:
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

captive_portal:

esp32_improv:
  authorizer: none

dashboard_import:
  package_import_url: github://athom-tech/esp32-configs/athom-rf-ir-remote.yaml

# Include the local Flash storage component
external_components:
  - source: github://athom-tech/esp32-configs@main
    components: [Flash_comp]

remote_receiver:
  - pin:
      number: ${RF_RX_PIN}
      inverted: true
    dump: rc_switch
    # RF433 fixed-code decoding: filter glitches, split frames on 4ms idle,
    # and widen tolerance for cheap remotes. rc_switch decoding rejects the
    # receiver's ambient noise, so learning no longer false-triggers.
    filter: 4us
    idle: 4ms
    tolerance: 50%
    id: rf_receiver
    # Protocol-aware capture analyser, gated behind the "RF Analyze" switch so
    # ambient 433 MHz noise does not spam the log. Unlike a plain raw dump this
    # validates structure before believing a capture: it least-squares fits the
    # symbol period T, then checks every symbol lands on an n*T grid. A clean
    # A-OK frame is exactly 64 symbols of 1*T and 66 of 2*T (T ~= 300us); a
    # clean Sublimex/Dooya frame is 40 bits on a T ~= 355us grid. Anything with
    # symbols off-grid, an unexpected count, or a large residual is a degraded
    # capture and is reported as such rather than silently accepted.
    #
    # It also prints the timing snapped to the fitted grid, ready to paste into
    # a transmit_raw button - which is how the codes further down were cleaned.
    on_raw:
      - lambda: |-
          if (!id(rf_analyze_mode))
            return;
          size_t n = x.size();
          if (n < 40) return;                       // ignore short noise bursts

          std::vector<int> mag;
          mag.reserve(n);
          for (auto d : x) mag.push_back(d < 0 ? -d : d);

          // Split header/gap items (long) from data symbols.
          std::vector<int> body;
          int header_items = 0;
          for (size_t i = 0; i < mag.size(); i++) {
            if (mag[i] > 1500) header_items++;
            else body.push_back(mag[i]);
          }
          if (body.size() < 30) {
            ESP_LOGW("RF_ANALYZE", "Only %d data symbols - too short, ignoring", (int) body.size());
            return;
          }

          // Least-squares fit of the symbol period T (every symbol ~= k*T).
          float T = 300.0f;
          for (int iter = 0; iter < 30; iter++) {
            float num = 0, den = 0;
            for (int d : body) {
              int k = (int) ((d / T) + 0.5f);
              if (k < 1) k = 1;
              if (k > 4) k = 4;
              num += (float) d * k;
              den += (float) k * k;
            }
            if (den > 0) T = num / den;
          }

          int c1 = 0, c2 = 0, cother = 0, maxres = 0;
          for (int d : body) {
            int k = (int) ((d / T) + 0.5f);
            if (k < 1) k = 1;
            if (k == 1) c1++; else if (k == 2) c2++; else cother++;
            int res = d - (int) (k * T + 0.5f);
            if (res < 0) res = -res;
            if (res > maxres) maxres = res;
          }

          const char *verdict = "UNKNOWN";
          if (cother == 0 && maxres < (int) (T * 0.25f)) {
            if (c1 == 64 && c2 == 66)        verdict = "GOOD A-OK frame (64x1T + 66x2T)";
            else if (c1 + c2 == 79)          verdict = "GOOD Dooya-length frame";
            else                             verdict = "on-grid, but unexpected symbol count";
          } else {
            verdict = "DEGRADED - off-grid symbols, do not trust";
          }
          ESP_LOGI("RF_ANALYZE", "items=%d header=%d symbols=%d T=%.1fus 1T=%d 2T=%d other=%d maxresid=%dus -> %s",
                   (int) n, header_items, (int) body.size(), T, c1, c2, cother, maxres, verdict);

          // A-OK field decode. The run structure is a pulse-distance code, same
          // scheme as Dooya but with T ~= 300us and 64 bits: pairing the runs
          // from index 1 gives (1T,2T)=0 and (2T,1T)=1, framed by a 2T header
          // low and a 2T trailing mark (which is why a frame has 64 one-T runs
          // and 66 two-T runs: one of each per bit, plus the two framing runs).
          if (body.size() >= 129) {
            bool paired = true;
            uint64_t code = 0;
            int bad_at = -1;
            for (int i = 0; i < 64; i++) {
              int hi = (int) ((body[1 + 2 * i] / T) + 0.5f);
              int lo = (int) ((body[2 + 2 * i] / T) + 0.5f);
              if (hi == 1 && lo == 2)      code = (code << 1);
              else if (hi == 2 && lo == 1) code = (code << 1) | 1ULL;
              else { paired = false; bad_at = i; break; }
            }
            if (paired) {
              uint8_t by[8];
              for (int i = 0; i < 8; i++) by[i] = (uint8_t) (code >> (56 - 8 * i));
              int s = 0;
              for (int i = 0; i < 7; i++) s += by[i];
              uint8_t calc = (uint8_t) ((s + 0x5D) & 0xFF);
              uint32_t dev = ((uint32_t) by[0] << 24) | ((uint32_t) by[1] << 16) |
                             ((uint32_t) by[2] << 8) | by[3];
              const char *cmdname = by[6] == 0x0B ? "UP/open" :
                                    by[6] == 0x43 ? "DOWN/close" :
                                    by[6] == 0x23 ? "STOP" : "unknown";
              ESP_LOGI("RF_ANALYZE", "  A-OK: code=0x%016llX ID=0x%08X ch=%d pad=0x%02X cmd=0x%02X (%s) cksum=0x%02X calc=0x%02X -> %s",
                       (unsigned long long) code, (unsigned) dev, (int) by[4], (int) by[5],
                       (int) by[6], cmdname, (int) by[7], (int) calc,
                       calc == by[7] ? "CHECKSUM OK" : "CHECKSUM BAD (capture is corrupt)");
              if (id(exp_expect_code) != 0) {
                bool match = (code == id(exp_expect_code));
                ESP_LOGI("RF_ANALYZE", "  LOOPBACK: expected 0x%016llX -> %s",
                         (unsigned long long) id(exp_expect_code),
                         match ? "MATCH - PASS (our transmitted waveform decodes correctly)"
                               : "MISMATCH - FAIL");
                if (match) id(exp_expect_code) = 0;   // stops E15 reporting a timeout
              }
            } else {
              ESP_LOGW("RF_ANALYZE", "  A-OK pair structure breaks at bit %d - degraded capture, do not use", bad_at);
            }
          }

          // Emit the grid-snapped waveform, chunked to stay inside the log buffer.
          std::string line;
          char buf[16];
          for (size_t i = 0; i < mag.size(); i++) {
            int q;
            if (mag[i] > 1500) {
              q = mag[i];                            // header/gap kept as measured
            } else {
              int k = (int) ((mag[i] / T) + 0.5f);
              if (k < 1) k = 1;
              q = (int) (k * T + 0.5f);
            }
            snprintf(buf, sizeof(buf), "%d, ", x[i] < 0 ? -q : q);
            line += buf;
            if ((i + 1) % 16 == 0) {
              ESP_LOGI("RF_ANALYZE", "  %s", line.c_str());
              line.clear();
            }
          }
          if (!line.empty())
            ESP_LOGI("RF_ANALYZE", "  %s", line.c_str());
    # Sublimex/Dooya frames get an exact field decode for free from ESPHome's
    # built-in protocol, which validates the header and all 40 bits - so any
    # frame that fires this is structurally sound, no grid fitting needed.
    on_dooya:
      - lambda: |-
          if (!id(rf_analyze_mode))
            return;
          ESP_LOGI("RF_ANALYZE", "DOOYA decoded: id=0x%06X channel=%d button=%d check=%d",
                   (unsigned int) x.id, (int) x.channel, (int) x.button, (int) x.check);
    on_rc_switch:
      - lambda: |-
          if (id(is_rf_learning_mode)) {
            std::vector<int> d;
            d.push_back((int) x.protocol);
            d.push_back((int) (x.code >> 32));
            d.push_back((int) (x.code & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned protocol=%u code=%llu slot=%d",
                     x.protocol, (unsigned long long) x.code, id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Signal learned!");
          }

  - pin:
      number: ${IR_RX_PIN}
      inverted: true
    dump: all
    tolerance: 25%
    idle: 65500us
    clock_resolution: "500000"
    id: ir_receiver
    on_raw:
      - lambda: |-
          if (id(is_learning_mode)) {
            if (x.size() > id(filter_size)) {
              id(signal_nvs).save_to_nvs(id(signal_select_index), x);
              ESP_LOGI("IR_LEARNING", "Signal saved to slot %d, size: %d", id(signal_select_index), x.size());
              id(is_learning_mode) = false;
              id(status_text).publish_state("Signal learned!");
            } else {
              ESP_LOGW("IR_LEARNING", "Signal too short: %d", x.size());
            }
          }

remote_transmitter:
  - pin:
      number: ${RF_TX_PIN}
    # OOK modulation for RF433 — keep duty at 100%
    carrier_duty_percent: 100%
    non_blocking: true
    id: rf_transmitter

  - pin:
      number: ${IR_TX_PIN}
      inverted: false
    carrier_duty_percent: 50%
    non_blocking: true
    id: ir_transmitter

infrared:
  - platform: ir_rf_proxy
    name: IR Proxy Transmitter
    id: ir_proxy_transmitter
    remote_transmitter_id: ir_transmitter

  - platform: ir_rf_proxy
    name: IR Proxy Receiver
    id: ir_proxy_receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ir_receiver

  # RF transmitter instance
radio_frequency:
  - platform: ir_rf_proxy
    name: 433MHz RF Transmitter
    id: rf_proxy_transmitter
    frequency: 433.92MHz
    remote_transmitter_id: rf_transmitter

  - platform: ir_rf_proxy
    name: 433MHz RF Receiver
    id: rf_proxy_receiver
    frequency: 433.92MHz
    remote_receiver_id: rf_receiver

climate:
  - id: "AC"
    name: "AC"
    platform: ${AC_Platform_name}
    transmitter_id: ir_transmitter
    receiver_id: ir_receiver

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: "diagnostic"

  - platform: gpio
    pin:
      number: ${Button_PIN}
      mode:
        input: true
      inverted: true
    name: "Button"
    disabled_by_default: true
    on_multi_click:
      - timing:
          - ON for at least 4s
        then:
          - button.press: Reset

sensor:
  - platform: uptime
    name: "Uptime Sensor"
    id: uptime_sensor
    type:
      timestamp
    entity_category: "diagnostic"

  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config

  - platform: safe_mode
    name: "Safe Mode"
    internal: false
    entity_category: config

  # IR learning button
  - platform: template
    name: "IR Learn"
    icon: mdi:remote-tv
    on_press:
      - lambda: |-
          id(is_learning_mode) = true;
          ESP_LOGI("IR_LEARNING", "Learning mode activated for slot %d", id(signal_select_index));
          id(status_text).publish_state("Ready to learn...");

  # IR send button
  - platform: template
    name: "IR Send"
    icon: mdi:send
    on_press:
      - script.execute: send_raw_signal

  # Clear the signal in the current slot
  - platform: template
    name: "IR Clear Slot"
    icon: mdi:delete
    on_press:
      - lambda: |-
          std::vector<int> empty_signal;
          id(signal_nvs).save_to_nvs(id(signal_select_index), empty_signal);
          ESP_LOGI("IR_LEARNING", "Cleared slot %d", id(signal_select_index));
          id(status_text).publish_state("Slot cleared");

  # RF433 learning button
  - platform: template
    name: "RF Learn"
    icon: mdi:remote
    on_press:
      - lambda: |-
          id(is_rf_learning_mode) = true;
          ESP_LOGI("RF_LEARNING", "Learning mode activated for slot %d", id(rf_signal_select_index));
          id(rf_status_text).publish_state("Ready to learn...");

  # RF433 send button
  - platform: template
    name: "RF Send"
    icon: mdi:send
    on_press:
      - script.execute: send_raw_rf_signal

  # Clear the RF signal in the current slot
  - platform: template
    name: "RF Clear Slot"
    icon: mdi:delete
    on_press:
      - lambda: |-
          std::vector<int> empty_signal;
          id(signal_nvs).save_to_nvs(id(rf_signal_select_index), empty_signal);
          ESP_LOGI("RF_LEARNING", "Cleared slot %d", id(rf_signal_select_index));
          id(rf_status_text).publish_state("Slot cleared");


  #################### Direct RF433 cover codes ####################
  # Waveforms recovered from a Tuya RF bridge export, whose study-mode payload
  # is plain uint16 little-endian microsecond values.
  #
  # Sublimex DC1600 covers speak Dooya (40 bits: 24-bit id, 8-bit channel,
  # 4-bit button, 4-bit check) and are replayed verbatim -- confirmed working.
  # That decode is also what established the capture convention used here: the
  # first value is the inter-frame gap (~7.76 ms, matching Dooya) and odd
  # indices are marks, so each frame starts and ends on a mark. Field testing
  # confirmed the same convention holds for the A-OK captures.
  #
  # A-OK AC123-02D covers use a ~98-bit Manchester encoding whose fields are
  # still undecoded -- but replaying the timing needs no field decode.
  # Their symbols are NOT replayed verbatim: the Tuya receiver reported every
  # 1xT symbol as one of two values (e.g. 273 and 318 us) and occasionally
  # stretched a 2xT symbol as far as 696 us. Least-squares fitting shows each
  # frame is exactly 64 symbols of 1xT and 66 of 2xT with T ~= 300 us, and the
  # recovered Manchester half-bit stream is bit-identical before and after
  # snapping every symbol to n*T -- so that spread carries no information and
  # is measurement artifact from the Tuya receiver's slicer. Replaying it would
  # re-inject another receiver's distortion (up to 103 us of error per symbol)
  # into a phase-sensitive 98-bit frame. The values below are therefore snapped
  # to a clean per-frame n*T grid.

  # Sublimex DC1600 (Dooya id=0xC389EB ch=5 button=1), captured at 433.3 MHz - verbatim
  - platform: template
    name: "Dormitorio Open"
    icon: mdi:arrow-up-bold-box
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: [
                  4798, -1466, 713, -381, 713, -341, 381, -713, 341, -713, 381, -713, 341, -713, 713, -341, 713,
                  -341, 713, -381, 381, -713, 381, -713, 381, -713, 713, -341, 381, -713, 341, -713, 713, -341,
                  713, -341, 713, -341, 713, -381, 381, -713, 713, -341, 381, -713, 713, -341, 713, -381, 341,
                  -713, 341, -713, 381, -713, 381, -713, 341, -713, 713, -341, 381, -713, 713, -341, 341, -713,
                  341, -713, 381, -713, 713, -341, 381, -713, 381, -713, 381, -713, 713
          ]
          repeat:
            times: 8
            wait_time: 7755us


  # Sublimex DC1600 (Dooya id=0xC389EB ch=5 button=3), captured at 433.24 MHz - verbatim
  - platform: template
    name: "Dormitorio Close"
    icon: mdi:arrow-down-bold-box
    on_press:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: [
                  4816, -1471, 751, -342, 706, -342, 380, -706, 380, -706, 380, -706, 380, -706, 751, -342, 751,
