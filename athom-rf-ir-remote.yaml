          cmd: 0x43
          t_us: 301
          hdr_us: 5115
          hdr_space_us: 0
          gap_us: 5115
          times: 12
          trailer: 1
          cks_delta: 0
      - delay: 3s
      - esp32_ble_tracker.start_scan:
