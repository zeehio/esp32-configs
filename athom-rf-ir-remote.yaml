# Covers built from learned slots: assign any slot as a cover's OPEN, CLOSE or
# STOP with the config buttons, then the cover appears in Home Assistant as a
# normal shutter with a position slider. Position is estimated from travel
# time (set per cover below); there is no position feedback over RF.
#
# Hand-rolled with platform: template instead of ESPHome's stock time_based:
# time_based's start_direction_() silently no-ops a repeated same-direction
# request (e.g. pressing Open again while it still thinks it's opening),
# which is correct for a cover with a real endstop signal but actively wrong
# here - our only signal that a command landed at all is whether the shutter
# moved, so every press must always retransmit. See cover_move_N in the
# script: section below for the actual open/close/stop/position logic; the
# motors stop themselves at their limits on a full open/close (no explicit
# stop is sent then), matching time_based's has_built_in_endstop behavior.
cover:
  - platform: template
    name: "Persiana Sala"
    id: persiana_sala
    device_class: shutter
    assumed_state: true
    restore_mode: NO_RESTORE
    open_action:
      - script.execute: { id: cover_move_1, target: 1.0 }
    close_action:
      - script.execute: { id: cover_move_1, target: 0.0 }
    position_action:
      - script.execute: { id: cover_move_1, target: !lambda 'return pos;' }
    stop_action:
      - script.stop: cover_move_1
      - lambda: |-
          if (id(cov_op)[0] != 0) {
            uint32_t elapsed = millis() - id(cov_move_start_ms)[0];
            float frac = id(cov_move_ms)[0] > 0 ? (float) elapsed / (float) id(cov_move_ms)[0] : 1.0f;
            if (frac > 1.0f) frac = 1.0f;
            if (frac < 0.0f) frac = 0.0f;
            float from = id(cov_move_from)[0], to = id(cov_move_target)[0];
            id(cov_pos_0) = from + (to - from) * frac;
            id(cov_op)[0] = 0;
          }
      - cover.template.publish:
          id: persiana_sala
          position: !lambda 'return id(cov_pos_0);'
          current_operation: "IDLE"
      - script.execute: { id: cover_cmd, cover: 0, cmd: 2 }
  - platform: template
    name: "Persiana Dormitorio"
