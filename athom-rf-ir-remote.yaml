          cks_delta: 0

  # --- Group B: the older 8-channel remote ---

  # The captured "Elia stop" actually came from transmitter 0xA3C056FF channel 8,
  # and it works - so Elia is still paired with that older remote. E6 checks
  # whether that pairing accepts other commands too, or only STOP.
  - platform: template
