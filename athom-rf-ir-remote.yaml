          trailer: 1
          cks_delta: 0


  # --- Group E: is Sublimex really plain Dooya? ---
  # This uses ESPHome's OWN built-in Dooya encoder with the decoded fields,
  # not our captured waveform. If Dormitorio opens, the Dooya decode
  # (id/channel/button) is confirmed and those covers need no stored waveform.
  - platform: template
    name: "EXP E13 Dormitorio OPEN via native Dooya"
    icon: mdi:flask
    on_press:
      - lambda: |-
          id(exp_trial)++;
          ESP_LOGI("EXP", "E13 trial=%d | Dormitorio OPEN using ESPHome's native Dooya encoder", id(exp_trial));
          ESP_LOGI("EXP", "  id=0xC389EB channel=5 button=1 check=1 (button 1=up/open)");
          ESP_LOGI("EXP", "  EXPECT: Dormitorio opens. Confirms Sublimex == Dooya and that no captured waveform is needed.");
      - remote_transmitter.transmit_dooya:
          transmitter_id: rf_transmitter
          id: 0xC389EB
          channel: 5
          button: 1
          check: 1

  # --- Group F: would the original nbits fix have been enough? ---
  # The stock firmware decoded the A-OK frame CORRECTLY as 64 bits via rc_switch
  # protocol 6 (its inverted short/long structure matches A-OK's distance
  # coding); it only failed because playback hardcoded 24 bits. E14 replays the
  # same code through protocol 6's ENCODER at the full 64 bits. Protocol 6 uses
  # 450/900us where A-OK uses ~300/600us, so this also probes how much timing
  # error the motor tolerates.
  - platform: template
    name: "EXP E14 Elia CLOSE via rc_switch proto 6, 64 bits"
    icon: mdi:flask
    on_press:
      - lambda: |-
          id(exp_trial)++;
          ESP_LOGI("EXP", "E14 trial=%d | Elia CLOSE via rc_switch protocol 6 encoder at 64 bits", id(exp_trial));
          ESP_LOGI("EXP", "  code=0xA3C86E2C020043A7 nbits=64");
          ESP_LOGI("EXP", "  proto 6 emits 450/900us bits vs A-OK's ~300/600us - also a timing-tolerance probe.");
          ESP_LOGI("EXP", "  EXPECT: if Elia closes, storing nbits=64 would have been enough on the stock firmware.");
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_transmitter
          protocol: 6
          code: "1010001111001000011011100010110000000010000000000100001110100111"
          repeat:
            times: 12
            wait_time: 5115us

  # --- Group G: automatic self-check (no observation needed) ---
  # Transmits a known code with the analyser armed, so the device's own receiver
  # decodes what it just sent. This validates the transmitted waveform end to end
  # and reports PASS/FAIL in the log by itself. It also tells us whether the
  # receive path works at all, which decides if learning from the remote is viable.
  - platform: template
    name: "EXP E15 Loopback self-test"
    icon: mdi:sync
    on_press:
      - lambda: |-
          id(exp_trial)++;
          id(rf_analyze_mode) = true;
          id(exp_expect_code) = 0xA3C86E2C020043A7ULL;
          ESP_LOGI("EXP", "E15 trial=%d | Loopback: transmitting Elia CLOSE with the analyser armed", id(exp_trial));
          ESP_LOGI("EXP", "  expecting the receiver to decode 0xA3C86E2C020043A7 back");
          ESP_LOGI("EXP", "  Look for an RF_ANALYZE LOOPBACK line - it reports PASS/FAIL automatically.");
      - script.execute:
          id: aok_tx
          exp: "E15"
          note: "loopback transmission"
          id_sel: 0
          channel: 2
          cmd: 0x43
          t_us: 301
          hdr_us: 5115
          hdr_space_us: 0
          gap_us: 5115
          times: 12
          trailer: 1
          cks_delta: 0
      - delay: 4s
      - lambda: |-
          if (id(exp_expect_code) != 0) {
            ESP_LOGW("EXP", "E15 RESULT: FAIL - the receiver never decoded a valid A-OK frame from our own transmission.");
            ESP_LOGW("EXP", "  => the RX path cannot hear this protocol here, so learning from the remote is unlikely to work.");
          }
          id(exp_expect_code) = 0;
          id(rf_analyze_mode) = false;

  - platform: template
    name: "EXP Reset trial counter"
    icon: mdi:counter
    on_press:
      - lambda: |-
          id(exp_trial) = 0;
          ESP_LOGI("EXP", "Trial counter reset to 0");



