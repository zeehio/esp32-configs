  #################### ROUND 2 EXPERIMENTS ####################
  # Round 1 was confounded: a CLOSE sent to an already-closed shutter is
  # indistinguishable from a failed transmission, and running 30 commands in a
  # row tripped the motor's thermal cutout. Both made "nothing happened"
  # ambiguous, so every 0/N result was uninterpretable.
  #
  # Round 2 uses STOP as the probe instead. Each button automatically moves the
  # shutter with a known-good command, waits, then sends the EXPERIMENTAL stop.
  # "Did it halt?" is unambiguous regardless of where the shutter was, and each
  # trial is a short partial travel, so the motor stays cool.
  # The mover alternates open/close every trial, so the shutter oscillates
  # mid-travel and never parks at a limit.
  #
  # Pace: leave a few seconds between presses, and take a 2-3 minute break every
  # ~10 trials. If a run starts failing consistently after many trials, suspect
  # the thermal cutout and rest the motor before continuing.
  # Press "EXP Reset trial counter" before each experiment.


  - platform: template
    name: "EXP R1 STOP baseline"
    icon: mdi:flask
    on_press:
      - script.execute: probe_move
      - script.wait: probe_move
      - script.execute:
          id: aok_tx
          exp: "R1"
          note: "stop probe"
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 0
      - script.wait: aok_tx
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R1 baseline: canonical synthesised STOP - the reference for R2-R9");
          ESP_LOGI("EXP", "    PASS = shutter halted early. FAIL = ran to the end.");
          ESP_LOGI("EXP", "    If it never moved at all, mark the trial VOID (mover missed).");


