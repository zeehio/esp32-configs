          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 0


  # --- Group C: why does Elia CLOSE occasionally fail? ---
  # Run each of E7-E10 about 10 times and report how many worked, so the rates
  # are comparable. E8 is the current firmware's behaviour (the baseline).

  # E7 replays the ORIGINAL un-quantised capture, including the Tuya receiver's
  # measurement spread (1T reported as both 272 and 317us here).
  - platform: template
    name: "EXP E7 Elia CLOSE verbatim capture"
    icon: mdi:flask
    on_press:
      - lambda: |-
          id(exp_trial)++;
          ESP_LOGI("EXP", "E7 trial=%d | Elia CLOSE, ORIGINAL un-quantised timings (1T spread 272/317us). Run ~10x and report success count.", id(exp_trial));
          ESP_LOGI("EXP", "  items=131 gap=5115us repeats=12 (verbatim, not synthesised)");
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: [
                  5115, -609, 609, -272, 272, -609, 609, -272, 317, -609, 317, -609, 317, -609, 609, -272, 609,
                  -272, 609, -272, 609, -272, 272, -609, 317, -609, 609, -272, 272, -609, 317, -609, 272, -609,
                  317, -609, 609, -272, 609, -272, 317, -609, 609, -272, 609, -272, 609, -272, 317, -609, 272,
                  -609, 317, -609, 609, -272, 317, -609, 609, -272, 609, -272, 272, -609, 317, -609, 317, -609,
                  272, -609, 317, -609, 317, -609, 317, -609, 272, -609, 609, -272, 272, -609, 272, -609, 317,
                  -609, 272, -609, 317, -609, 272, -609, 272, -609, 317, -609, 317, -609, 317, -609, 609, -272,
                  317, -609, 272, -609, 317, -609, 272, -609, 609, -272, 609, -272, 609, -272, 272, -609, 609,
                  -272, 272, -609, 272, -609, 609, -272, 609, -272, 609, -272, 609
          ]
          repeat:
            times: 12
            wait_time: 5115us


  - platform: template
    name: "EXP E8 Elia CLOSE snapped, 12 reps (baseline)"
