          exp: "R7"
          note: "stop probe"
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 0
          cks_delta: 0
      - script.wait: aok_tx
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R7: final 2T mark omitted - is the trailer required?");
          ESP_LOGI("EXP", "    PASS = shutter halted early. FAIL = ran to the end.");
          ESP_LOGI("EXP", "    If it never moved at all, mark the trial VOID (mover missed).");


  - platform: template
    name: "EXP R8 STOP header variant B"
    icon: mdi:flask
    on_press:
      - script.execute: probe_move
      - script.wait: probe_move
      - script.execute:
          id: aok_tx
          exp: "R8"
          note: "stop probe"
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 5000
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 0
      - script.wait: aok_tx
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R8: 5000us header SPACE instead of 2T - settles the header ambiguity");
          ESP_LOGI("EXP", "    PASS = shutter halted early. FAIL = ran to the end.");
          ESP_LOGI("EXP", "    If it never moved at all, mark the trial VOID (mover missed).");


  - platform: template
    name: "EXP R10 STOP bad checksum"
    icon: mdi:flask-off
    on_press:
      - script.execute: probe_move
      - script.wait: probe_move
      - script.execute:
          id: aok_tx
          exp: "R10"
          note: "stop probe"
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 1
      - script.wait: aok_tx
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R10 NEGATIVE CONTROL: checksum deliberately +1. Here PASS/FAIL is inverted - the shutter SHOULD run to the end. If it halts, the motor ignores the checksum");
          ESP_LOGI("EXP", "    PASS = shutter halted early. FAIL = ran to the end.");
          ESP_LOGI("EXP", "    If it never moved at all, mark the trial VOID (mover missed).");


  - platform: template
    name: "EXP R6 STOP with BLE paused"
    icon: mdi:flask
    on_press:
      - esp32_ble_tracker.stop_scan:
      - delay: 300ms
      - script.execute: probe_move
      - script.wait: probe_move
      - script.execute:
          id: aok_tx
          exp: "R6"
          note: "stop probe"
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 0
      - script.wait: aok_tx
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R6: same as R1 but with BLE scanning stopped throughout");
          ESP_LOGI("EXP", "    PASS = shutter halted early. FAIL = ran to the end.");
      - esp32_ble_tracker.start_scan:
          continuous: true

  - platform: template
    name: "EXP R9 STOP via rc_switch proto 6"
    icon: mdi:flask
    on_press:
      - script.execute: probe_move
      - script.wait: probe_move
      - remote_transmitter.transmit_rc_switch_raw:
          transmitter_id: rf_transmitter
          protocol: 6
          code: "1010001111001000011011100010110000000010000000000010001110000111"
          repeat:
            times: 12
            wait_time: 5000us
      - delay: 2500ms
      - lambda: |-
          ESP_LOGI("EXP", "  ^ R9: same 64-bit code through rc_switch protocol 6's encoder");
          ESP_LOGI("EXP", "    proto 6 emits 450/900us where A-OK uses ~300/600us, so this also");
          ESP_LOGI("EXP", "    probes how much timing error the motor tolerates.");
          ESP_LOGI("EXP", "    PASS = halted early (nbits=64 alone would have fixed stock firmware).");

  # --- Sublimex / Dooya ---
  # Round 1's E13 was my bug: transmit_dooya had no `repeat:`, so it sent ONE
  # frame where the working button sends 8. Fixed here, and now probed with
  # Dooya's own STOP (button 5) so the result cannot be confounded by position.
  - platform: template
    name: "EXP R11 Dormitorio STOP via native Dooya"
    icon: mdi:flask
    on_press:
      - button.press: btn_dormitorio_open
      - delay: 3500ms
      - remote_transmitter.transmit_dooya:
          transmitter_id: rf_transmitter
          id: 0xC389EB
          channel: 5
          button: 5
          check: 5
          repeat:
            times: 8
            wait_time: 7755us
      - delay: 2500ms
      - lambda: |-
          id(exp_trial)++;
          ESP_LOGI("EXP", "R11 trial=%d | Dormitorio moved with the known-good code, then stopped", id(exp_trial));
          ESP_LOGI("EXP", "  using ESPHome's NATIVE Dooya encoder: id=0xC389EB channel=5 button=5(stop)");
          ESP_LOGI("EXP", "  PASS = halted early -> Sublimex really is plain Dooya and needs no stored waveform.");

  - platform: template
    name: "EXP Reset trial counter"
    icon: mdi:counter
    on_press:
      - lambda: |-
          id(exp_trial) = 0;
          id(probe_dir) = false;
          ESP_LOGI("EXP", "Trial counter reset");



switch:
  # Turn on, press a button on the physical remote near the device, then read
  # the "RF_ANALYZE" lines in the ESPHome log. Turn off when finished.
  - platform: template
    name: "RF Learn"
    icon: mdi:school
    optimistic: true
    entity_category: config
    turn_on_action:
      - lambda: |-
          id(rf_analyze_mode) = true;
          ESP_LOGI("RF_LEARN", "Learn mode ON - press a button on any RF remote near the device.");
          ESP_LOGI("RF_LEARN", "Only frames that fully validate are logged (A-OK by checksum,");
          ESP_LOGI("RF_LEARN", "Dooya by ESPHome's own decoder), so background noise stays quiet.");
    turn_off_action:
      - lambda: |-
          id(rf_analyze_mode) = false;
          ESP_LOGI("RF_LEARN", "Learn mode OFF");

  # Verbose waveform dump for deep debugging. Separate from RF Learn and off by
  # default - this is what flooded the log in round 1. Leave it off unless a
  # remote refuses to decode and the raw timing is genuinely needed.
  - platform: template
    name: "RF Raw Debug"
    icon: mdi:waveform
    optimistic: true
    entity_category: config
    turn_on_action:
      - lambda: |-
          id(rf_raw_debug) = true;
          ESP_LOGW("RF_RAW", "Raw debug ON - verbose, expect noise. Turn off when done.");
    turn_off_action:
      - lambda: |-
          id(rf_raw_debug) = false;
          ESP_LOGI("RF_RAW", "Raw debug OFF");

