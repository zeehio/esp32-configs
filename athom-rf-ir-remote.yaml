substitutions:
  # Default name
  name: "athom-rf-ir-remote"
  # Default friendly name
  friendly_name: "Athom RF IR Remote"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "athom esp32 RF433 IR Remote"
  # Project Name
  project_name: "China Athom Technology.Athom RF IR Remote"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "v3.9.1"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "DEBUG"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # valid value: ballu, coolix, daikin, daikin_arc, daikin_brc, delonghi, emmeti, fujitsu_general, gree, hitachi_ac344, hitachi_ac424, climate_ir_lg, midea_ir, mitsubishi, noblex, tcl112, toshiba, whirlpool, yashima, whynter, zhlt01, heatpumpir
  # https://esphome.io/components/climate/climate_ir/
  AC_Platform_name: "coolix"

#########################GPIO######################
  RF_RX_PIN: GPIO19
  RF_TX_PIN: GPIO18
  IR_RX_PIN: GPIO33
  IR_TX_PIN: GPIO25
  Button_PIN: GPIO0
  LED_PIN: GPIO27
#########################GPIO######################

esphome:
  # The cover-code cache lives in RAM; rebuild it from NVS after every boot
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGW("BUILD", "running ${project_version}");
          id(ha_event).execute(std::string("Booted ${project_version}"));
      - script.execute: seed_known_codes
      - script.wait: seed_known_codes
      - script.execute: rebuild_cover_cache
      # Covers are restore_mode: NO_RESTORE (they don't carry their own
      # position - cov_pos_0..3 does, restored independently above), so push
      # the restored estimate into each cover explicitly. Without this each
      # cover's position would be whatever its uninitialized internal field
      # happens to read until the first real move. Read from cov_pos_N rather
      # than hardcoded, so a genuinely restored value isn't clobbered back to
      # 0.5 on every boot.
      - cover.template.publish: { id: persiana_sala, position: !lambda 'return id(cov_pos_0);', current_operation: "IDLE" }
      - cover.template.publish: { id: persiana_dormitorio, position: !lambda 'return id(cov_pos_1);', current_operation: "IDLE" }
      - cover.template.publish: { id: persiana_elia, position: !lambda 'return id(cov_pos_2);', current_operation: "IDLE" }
      - cover.template.publish: { id: persiana_sofia, position: !lambda 'return id(cov_pos_3);', current_operation: "IDLE" }
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  name_add_mac_suffix: true
  min_version: 2026.5.1
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 1min

# Global variables for IR learning
globals:
  - id: is_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: signal_select_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: filter_size
    type: int
    restore_value: no
    initial_value: '10'
  # RF433 learning mode flag (independent from IR learning)
  - id: is_rf_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  # RF433 slot index, offset to 10-25 so it never collides with IR slots 0-9
  - id: rf_signal_select_index
    type: int
    restore_value: yes
    initial_value: '10'
  # Temp holders for the rc_switch code/protocol to transmit; referenced by
  # transmit_rc_switch_raw's !lambda during playback
  - id: rf_tx_code
    type: uint64_t
    restore_value: no
    initial_value: '0'
  - id: rf_tx_protocol
    type: int
    restore_value: no
    initial_value: '0'
  # Scratch waveform for A-OK playback; transmit_raw's code lambda must return
  # std::vector<int32_t>, so the global matches that type exactly
  - id: rf_aok_buf
    type: std::vector<int32_t>
    restore_value: no
    initial_value: 'std::vector<int32_t>()'
  # --- A-OK send tunables, for A/B testing against a real cover -----------
  # All of these feed aok_send (used by both "RF Send" and cover playback),
  # so toggling one and then operating a cover from Home Assistant tests it
  # against the real motor, not a synthetic loopback.
  #
  # Prepends the 8x(340,520)us preamble akirjavainen/A-OK documents some real
  # remotes sending before the AGC header, to settle a receiver's AGC/slicer
  # before the frame arrives. Off by default: this device's shipped behavior
  # has never included it, so enabling it is the thing under test, not a
  # silent behavior change.
  - id: rf_aok_preamble
    type: bool
    restore_value: yes
    initial_value: 'false'
  # 0 = upstream (akirjavainen/A-OK spec: 270/565us bits, 5300/530us AGC -
  # what this firmware has always sent). 1 = measured (302/604us bits,
  # 5114/604us AGC - captured from our own receiver against a real A-OK
  # remote on this hardware; see the rf433-direct-transmit branch).
  - id: rf_aok_preset
    type: int
    restore_value: yes
    initial_value: '0'
  # akirjavainen/A-OK's REPEAT_COMMAND is 8; that has been this firmware's
  # fixed repeat count since the A-OK feature was added.
  - id: rf_aok_repeats
    type: int
    restore_value: yes
    initial_value: '8'
  # Silence after the last bit of each repeat, in microseconds. The spec's
  # AOK_RADIO_SILENCE is 5030; the trailing bit's own short-mark space adds
  # to this, so the shipped default reproduces exactly what this firmware
  # has always sent regardless of which timing preset is selected.
  - id: rf_aok_silence_us
    type: int
    restore_value: yes
    initial_value: '5030'
  # Slot resolved by cover_cmd for the current action; -1 when unassigned
  - id: cover_tmp_slot
    type: int
    restore_value: no
    initial_value: '-1'
  # --- Hand-rolled cover position tracking (cover_move_1..4 in script:) ---
  # Position estimate per cover (0.0 closed .. 1.0 open), restored across
  # reboots. Four separate scalar globals rather than one std::vector: the
  # restore mechanism (RestoringGlobalsComponent, esphome/components/globals/
  # globals_component.h) persists a global via memcpy(sizeof(T)) - safe for a
  # plain float, but for a std::vector that only captures its pointer/size/
  # capacity control block, not the heap data it points to. Restoring that
  # verbatim on the next boot would reload a dangling pointer from the
  # previous boot's freed heap. Scalars sidestep the problem entirely.
  - id: cov_pos_0
    type: float
    restore_value: yes
    initial_value: '0.5f'
  - id: cov_pos_1
    type: float
    restore_value: yes
    initial_value: '0.5f'
  - id: cov_pos_2
    type: float
    restore_value: yes
    initial_value: '0.5f'
  - id: cov_pos_3
    type: float
    restore_value: yes
    initial_value: '0.5f'
  # Per-move bookkeeping used to interpolate position while moving and to
  # freeze it correctly on Stop. Unlike position itself, these are NOT
  # restored: a move that was in progress before a reboot should not be
  # assumed still running afterward (the motor lost power too), so cov_op
  # always starts idle and a fresh move recomputes these from scratch.
  # 0=idle, 1=opening, 2=closing
  - id: cov_op
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(4, 0)'
  - id: cov_move_from
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(4, 0.5f)'
  - id: cov_move_target
    type: std::vector<float>
    restore_value: no
    initial_value: 'std::vector<float>(4, 0.5f)'
  - id: cov_move_start_ms
    type: std::vector<uint32_t>
    restore_value: no
    initial_value: 'std::vector<uint32_t>(4, 0)'
  - id: cov_move_ms
    type: std::vector<uint32_t>
    restore_value: no
    initial_value: 'std::vector<uint32_t>(4, 0)'
  # RAM cache of the codes assigned to each cover action, indexed cover*3+action
  # (action 0=open 1=close 2=stop). Type 0 marks an unassigned entry. Rebuilt
  # from NVS at boot and whenever slots or assignments change, so matching a
  # received frame is a 12-entry scan instead of NVS reads in the receive path.
  - id: cover_code_type
    type: std::vector<int>
    restore_value: no
    initial_value: 'std::vector<int>(12, 0)'
  - id: cover_code_val
    type: std::vector<uint64_t>
    restore_value: no
    initial_value: 'std::vector<uint64_t>(12, 0)'
  # Received frame handed from the receive hooks to rf_rx_dispatch
  - id: rx_type
    type: int
    restore_value: no
    initial_value: '0'
  - id: rx_code
    type: uint64_t
    restore_value: no
    initial_value: '0'
  # Debounce for remote bursts: one physical press decodes as many frames
  - id: rx_last_key
    type: int
    restore_value: no
    initial_value: '-1'
  - id: rx_last_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Anti-echo window: while set, cover_cmd updates position without
  # retransmitting, because the command came from a physical remote the motor
  # already heard
  - id: rf_echo_until
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Flash storage component for saving IR signals
Flash_comp:
  id: signal_nvs

api:
  reboot_timeout: 0s
  # Only enable BLE tracking when wifi is up and api is connected
  # Gives single-core ESP32-C3 devices time to manage wifi and authenticate with api
  on_client_connected:
     - esp32_ble_tracker.start_scan:
        continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
  # Enables OTA firmware flashing from a URL (used by the update component below)
  - platform: http_request
    id: ota_http_request

# Required by the ota http_request platform and the update component.
# verify_ssl: false skips TLS cert validation to reduce heap/RAM pressure during
# the download; the manifest's MD5 still verifies firmware integrity before flashing.
http_request:
  id: http_request_component
  verify_ssl: false

update:
  # Managed updates via HTTP request: periodically checks the published manifest
  # and exposes a "Firmware Update" entity, pointing at this device's GitHub Pages
  # manifest. Pages URLs avoid the redirect/buffer issues of Release download URLs.
  - platform: http_request
    id: update_http_request
    name: "Firmware Update"
    source: https://athom-tech.github.io/esp32-configs/firmware/athom-rf-ir-remote.manifest.json
    # update_interval defaults to 6h (how often it checks, not installs)

logger:
  baud_rate: 0
  level: ${log_level}

mdns:
  disabled: false

web_server:
  port: 80
  version: 3

network:
  enable_ipv6: ${ipv6_enable}

wifi:
  # This spawns an AP with the device name and mac address with no password.
  ap: {}
  # Allow rapid re-connection to previously connect WiFi SSID, skipping scan of all SSID
  fast_connect: "${wifi_fast_connect}"
  # Define dns domain / suffix to add to hostname
  domain: "${dns_domain}"

esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window:   300ms  # default 30ms - how long to actually "listen" in each interval. Reduce this if device is unstable.
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true

captive_portal:

esp32_improv:
  authorizer: none

dashboard_import:
  package_import_url: github://athom-tech/esp32-configs/athom-rf-ir-remote.yaml

# Include the local Flash storage component
external_components:
  - source: github://athom-tech/esp32-configs@main
    components: [Flash_comp]

remote_receiver:
  - pin:
      number: ${RF_RX_PIN}
      inverted: true
    # dooya is dumped alongside rc_switch so that a Dooya remote press is
    # visible in the log as [remote.dooya] lines even outside learning mode -
    # if a press decodes but learning misses it, the two can be told apart.
    dump:
      - rc_switch
      - dooya
    # RF433 fixed-code decoding: filter glitches, split frames on 4ms idle,
    # and widen tolerance for cheap remotes. rc_switch decoding rejects the
    # receiver's ambient noise, so learning no longer false-triggers.
    filter: 4us
    idle: 4ms
    tolerance: 50%
    id: rf_receiver
    # Slot storage format: [type, code_hi, code_lo].
    #   type  1..8 -> rc_switch protocol number (the original format, unchanged)
    #   type  -1   -> Dooya, code packs the decoded fields (see on_dooya)
    #   type  -2   -> A-OK, code is the 64-bit frame content
    # A negative type can never collide with an rc_switch protocol, so slots
    # learned by older firmware keep playing, and older firmware refuses newer
    # slots safely (its playback requires protocol > 0).
    on_rc_switch:
      - lambda: |-
          // A-OK covers/awnings (reverse-engineered in
          // github.com/akirjavainen/A-OK): 65-bit frames of
          // [start 0xA3][24-bit ID][16-bit address][8-bit cmd][8-bit
          // checksum][constant 1]. rc_switch protocol 6 is the same
          // pulse-distance scheme, so it decodes the first 64 bits
          // correctly; the constant trailing 1 never reaches the code.
          // rc_switch cannot report a bit count, but the checksum only
          // validates if all 64 bits arrived, so a passing checksum is
          // both the completeness check and the protocol identification:
          // shorter codes (EV1527 etc.) have a zero top byte, never 0xA3.
          bool aok = false;
          if (x.protocol == 6) {
            uint8_t b[8];
            for (int i = 0; i < 8; i++) b[i] = (uint8_t) (x.code >> (56 - 8 * i));
            uint8_t cks = (uint8_t) ((b[1] + b[2] + b[3] + b[4] + b[5] + b[6]) & 0xFF);
            if (b[0] == 0xA3 && cks == b[7]) {
              // The remote follows every UP/DOWN with an "after up/down"
              // burst (cmd 0x24). It is neither worth storing nor a command
              // by itself, so it is skipped in both learning and matching.
              if (b[6] == 0x24) {
                ESP_LOGD("RF_LEARNING", "Ignoring A-OK follow-up frame (cmd 0x24)");
                return;
              }
              aok = true;
              if (id(is_rf_learning_mode)) {
                std::vector<int> d;
                d.push_back(-2);
                d.push_back((int) (x.code >> 32));
                d.push_back((int) (x.code & 0xFFFFFFFF));
                id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
                ESP_LOGI("RF_LEARNING", "Learned A-OK id=0x%02X%02X%02X address=0x%02X%02X cmd=0x%02X slot=%d",
                         b[1], b[2], b[3], b[4], b[5], b[6], id(rf_signal_select_index));
                id(is_rf_learning_mode) = false;
                id(rf_status_text).publish_state("A-OK signal learned!");
                {
                  char eb[72];
                  snprintf(eb, sizeof(eb), "Learned A-OK code=0x%016llX slot=%d",
                           (unsigned long long) x.code, id(rf_signal_select_index));
                  id(ha_event).execute(std::string(eb));
                }
                id(rebuild_cover_cache).execute();
                return;
              }
            }
          }
          if (id(is_rf_learning_mode)) {
            std::vector<int> d;
            d.push_back((int) x.protocol);
            d.push_back((int) (x.code >> 32));
            d.push_back((int) (x.code & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned protocol=%u code=%llu slot=%d",
                     x.protocol, (unsigned long long) x.code, id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Signal learned!");
            {
              char eb[72];
              snprintf(eb, sizeof(eb), "Learned rc_switch proto=%u code=%llu slot=%d",
                       x.protocol, (unsigned long long) x.code, id(rf_signal_select_index));
              id(ha_event).execute(std::string(eb));
            }
            id(rebuild_cover_cache).execute();
            return;
          }
          // Not learning: a frame from a physical remote may belong to one of
          // the covers - hand it to the matcher so the position estimate
          // follows remote presses too.
          id(rx_type) = aok ? -2 : (int) x.protocol;
          id(rx_code) = x.code;
          id(rf_rx_dispatch).execute();
    # Dooya learning from raw timings. On this board the receiver's captures
    # are sign-flipped and start at the ~1500us header SPACE - the 5000us
    # header mark is swallowed as pre-capture idle - so ESPHome's on_dooya
    # decoder (which demands the 5000/1500 header as its first item) can never
    # match. This is also why A-OK remotes decode only via rc_switch protocol
    # 6, the table's single inverted entry. Rather than flipping the pin's
    # inverted flag (which would break protocol-6 A-OK learning and every
    # already-learned rc_switch slot), Dooya is decoded here from magnitudes
    # alone: strip header items >= 1400us, require the 79 or 80 symbols of a
    # 40-bit frame, and read bits as (long,short)=1 / (short,long)=0.
    on_raw:
      - lambda: |-
          std::vector<int> body;
          body.reserve(80);
          for (int32_t v : x) {
            int m = v < 0 ? -v : v;
            if (m >= 1400) continue;      // header space / inter-frame gap
            if (m < 150) return;          // glitch: not a clean frame
            body.push_back(m);
          }
          if (body.size() != 79 && body.size() != 80)
            return;
          // Classify short (~350us) vs long (~750us); reject anything that
          // sits ambiguously between the two grids.
          uint64_t bits = 0;
          int nbits = 0;
          for (size_t i = 0; i + 1 < body.size(); i += 2) {
            bool a_long = body[i] > 540, b_long = body[i + 1] > 540;
            if (a_long == b_long) return; // not a valid Dooya symbol pair
            bits = (bits << 1) | (a_long ? 1 : 0);
            nbits++;
          }
          if (body.size() == 79) {
            // The final bit's space merged into the gap; its mark alone
            // determines the value.
            bits = (bits << 1) | (body[78] > 540 ? 1 : 0);
            nbits++;
          }
          if (nbits != 40)
            return;
          uint32_t d_id = (uint32_t) ((bits >> 16) & 0xFFFFFF);
          uint8_t d_ch = (uint8_t) ((bits >> 8) & 0xFF);
          uint8_t d_btn = (uint8_t) ((bits >> 4) & 0xF);
          uint8_t d_chk = (uint8_t) (bits & 0xF);
          if (id(is_rf_learning_mode)) {
            std::vector<int> d;
            d.push_back(-1);
            d.push_back((int) (bits >> 32));
            d.push_back((int) (bits & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned Dooya id=0x%06X channel=%d button=%d check=%d slot=%d",
                     (unsigned int) d_id, (int) d_ch, (int) d_btn, (int) d_chk,
                     id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Dooya signal learned!");
            {
              char eb[80];
              snprintf(eb, sizeof(eb), "Learned Dooya id=0x%06X ch=%d btn=%d slot=%d",
                       (unsigned int) d_id, (int) d_ch, (int) d_btn, id(rf_signal_select_index));
              id(ha_event).execute(std::string(eb));
            }
            id(rebuild_cover_cache).execute();
            return;
          }
          // Not learning: a valid Dooya frame from a physical remote may
          // belong to a cover - hand it to the matcher.
          id(rx_type) = -1;
          id(rx_code) = bits;
          id(rf_rx_dispatch).execute();
    # Kept for boards whose receiver polarity lets ESPHome's own decoder see
    # the full header; on this hardware it never fires (see on_raw above).
    # Harmless overlap: whichever path stores first clears the learning flag.
    on_dooya:
      - lambda: |-
          if (id(is_rf_learning_mode)) {
            uint64_t code = ((uint64_t) x.id << 16) |
                            ((uint64_t) (uint8_t) x.channel << 8) |
                            ((uint64_t) (x.button & 0xF) << 4) |
                            (uint64_t) (x.check & 0xF);
            std::vector<int> d;
            d.push_back(-1);
            d.push_back((int) (code >> 32));
            d.push_back((int) (code & 0xFFFFFFFF));
            id(signal_nvs).save_to_nvs(id(rf_signal_select_index), d);
            ESP_LOGI("RF_LEARNING", "Learned Dooya id=0x%06X channel=%d button=%d check=%d slot=%d",
                     (unsigned int) x.id, (int) x.channel, (int) x.button, (int) x.check,
                     id(rf_signal_select_index));
            id(is_rf_learning_mode) = false;
            id(rf_status_text).publish_state("Dooya signal learned!");
            {
              char eb[80];
              snprintf(eb, sizeof(eb), "Learned Dooya id=0x%06X ch=%d btn=%d slot=%d",
                       (unsigned int) x.id, (int) x.channel, (int) x.button, id(rf_signal_select_index));
              id(ha_event).execute(std::string(eb));
            }
            id(rebuild_cover_cache).execute();
          }

  - pin:
      number: ${IR_RX_PIN}
      inverted: true
    dump: all
    tolerance: 25%
    idle: 65500us
    clock_resolution: "500000"
    id: ir_receiver
    # AC/climate remotes send frames of several hundred timing items (Daikin
    # and friends exceed 500), far beyond the 192-symbol default software
    # buffer, so those captures were truncated or dropped and learning missed
    # them. This is a software ring buffer - it does not touch the RMT
    # hardware symbol allocation, which is already at the ESP32's limit across
    # the four remote channels.
    receive_symbols: 1024
    on_raw:
      - lambda: |-
          if (id(is_learning_mode)) {
            if (x.size() > id(filter_size)) {
              // NVS blobs top out near 4000 bytes; int items are 4 bytes each.
              if (x.size() > 950) {
                ESP_LOGW("IR_LEARNING", "Captured %d items - too large to store, not saved", x.size());
                id(status_text).publish_state("Signal too long to store");
                return;
              }
              id(signal_nvs).save_to_nvs(id(signal_select_index), x);
              ESP_LOGI("IR_LEARNING", "Signal saved to slot %d, size: %d", id(signal_select_index), x.size());
              id(is_learning_mode) = false;
              id(status_text).publish_state("Signal learned!");
            } else {
              ESP_LOGW("IR_LEARNING", "Signal too short: %d", x.size());
            }
          }

