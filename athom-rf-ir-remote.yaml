  #################### VALIDATION EXPERIMENTS ####################
  # Each button runs one experiment and logs an "EXP" block naming the
  # experiment, a per-experiment trial counter, and exactly what was
  # transmitted (fields, 64-bit code, checksum, and waveform parameters).
  # Press a button, observe the covers, and report the outcome per trial.
  #
  # A-OK frames are SYNTHESISED from fields, not replayed from a capture:
  #   64 bits = [32-bit ID][8-bit channel][8-bit pad 0x00][8-bit cmd][8-bit checksum]
  #   checksum = (sum of the first 7 bytes + 0x5D) & 0xFF
  #   cmd 0x0B = UP/open, 0x43 = DOWN/close, 0x23 = STOP
  #   bit 0 = (1T mark, 2T space), bit 1 = (2T mark, 1T space), T ~= 300us
  #   frame  = [5000us mark][2T space][64 bits][2T mark]
  # Known transmitters: 0xA3C86E2C ch1=Sofia ch2=Elia (current 2-channel remote)
  #                     0xA3C056FF ch8       (older 8-channel remote)

  # --- Group A: does the synthesis + checksum model actually hold? ---

  # E1 is the decisive test of the checksum rule: this exact code was NEVER
  # captured from any remote. Its checksum (0x87) is derived purely from the
  # rule. If Elia stops, the rule and the whole field model are confirmed.
  - platform: template
    name: "EXP E1 Synth Elia STOP (never captured)"
    icon: mdi:flask
    on_press:
      - script.execute:
          id: aok_tx
          exp: "E1"
          note: "Synthesised Elia STOP, checksum 0x87 derived from the rule, never captured. EXPECT: Elia stops (press while Elia is moving)."
          id_sel: 0
          channel: 2
          cmd: 0x23
          t_us: 299
          hdr_us: 5000
          hdr_space_us: 0
          gap_us: 5000
          times: 12
          trailer: 1
          cks_delta: 0

  # E2 reproduces a code we DID capture, but built from fields instead of
  # replayed. Software says the waveform is bit-identical; this checks that on air.
  - platform: template
    name: "EXP E2 Synth Elia CLOSE (matches capture)"
    icon: mdi:flask
    on_press:
      - script.execute:
          id: aok_tx
          exp: "E2"
          note: "Synthesised Elia CLOSE, should be bit-identical to the captured waveform. EXPECT: Elia closes, as reliably as the normal button."
          id_sel: 0
          channel: 2
          cmd: 0x43
          t_us: 301
          hdr_us: 5115
          hdr_space_us: 0
          gap_us: 5115
          times: 12
          trailer: 1
          cks_delta: 0

  # E3 is a NEGATIVE control. Identical to E2 but with the checksum off by one.
  # If Elia still closes, the motor ignores the checksum and our "explainable"
  # model is weaker than claimed.
  - platform: template
    name: "EXP E3 Elia CLOSE with BAD checksum"
    icon: mdi:flask-off
    on_press:
      - script.execute:
          id: aok_tx
          exp: "E3"
          note: "NEGATIVE CONTROL: Elia CLOSE with checksum deliberately +1. EXPECT: nothing happens. If it closes, the motor does not verify the checksum."
          id_sel: 0
          channel: 2
          cmd: 0x43
          t_us: 301
          hdr_us: 5115
          hdr_space_us: 0
          gap_us: 5115
          times: 12
          trailer: 1
          cks_delta: 1

  # E4/E5 test the channel byte in isolation: same ID, same command, only the
  # channel differs. They should address different covers.
  - platform: template
    name: "EXP E4 UP on channel 1"
    icon: mdi:flask
    on_press:
      - script.execute:
          id: aok_tx
          exp: "E4"
          note: "UP with channel=1. EXPECT: SOFIA opens and Elia does NOT move."
          id_sel: 0
          channel: 1
          cmd: 0x0B
          t_us: 302
          hdr_us: 5105
          hdr_space_us: 0
          gap_us: 5105
          times: 12
          trailer: 1
          cks_delta: 0

  - platform: template
    name: "EXP E5 UP on channel 2"
    icon: mdi:flask
    on_press:
