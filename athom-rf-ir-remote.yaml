    position_action:
      - script.execute: { id: cover_move_2, target: !lambda 'return pos;' }
    stop_action:
      - script.stop: cover_move_2
      - lambda: |-
          if (id(cov_op)[1] != 0) {
            uint32_t elapsed = millis() - id(cov_move_start_ms)[1];
            float frac = id(cov_move_ms)[1] > 0 ? (float) elapsed / (float) id(cov_move_ms)[1] : 1.0f;
            if (frac > 1.0f) frac = 1.0f;
            if (frac < 0.0f) frac = 0.0f;
            float from = id(cov_move_from)[1], to = id(cov_move_target)[1];
            id(cov_pos_1) = from + (to - from) * frac;
            id(cov_op)[1] = 0;
          }
      - cover.template.publish:
          id: persiana_dormitorio
          position: !lambda 'return id(cov_pos_1);'
          current_operation: "IDLE"
      - script.execute: { id: cover_cmd, cover: 1, cmd: 2 }
  - platform: template
    name: "Persiana Elia"
    id: persiana_elia
    device_class: shutter
    assumed_state: true
    restore_mode: NO_RESTORE
    open_action:
      - script.execute: { id: cover_move_3, target: 1.0 }
