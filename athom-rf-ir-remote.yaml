  # E10 pauses BLE scanning around the transmission. bluetooth_proxy and the BLE
  # tracker are active on this device and compete for radio/CPU time.
  - platform: template
    name: "EXP E10 Elia CLOSE with BLE paused"
    icon: mdi:flask
    on_press:
      - esp32_ble_tracker.stop_scan:
      - delay: 300ms
      - script.execute:
          id: aok_tx
          exp: "E10"
          note: "Same as E8 but with BLE scanning stopped first. Tests BLE/WiFi interference. Run ~10x and report success count. BLE restarts automatically after."
          id_sel: 0
